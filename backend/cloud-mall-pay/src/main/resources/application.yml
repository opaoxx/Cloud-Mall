server: {port: 8086}
cloudmall.internal.callback-token: ${CLOUDMALL_INTERNAL_CALLBACK_TOKEN:cloudmall-local-callback}
spring:
  application: {name: cloud-mall-pay}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_pay?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root}
  rabbitmq: {host: localhost, port: 15673, username: root, password: root}
  jackson.time-zone: Asia/Shanghai
  task.scheduling.pool.size: 2
cloudmall.pay.recovery-interval-ms: 5000
cloudmall.pay.debit-mode: LEGACY
cloudmall.pay.tcc-reconciliation.enabled: false
cloudmall.pay.tcc-user-evidence.enabled: false
cloudmall.pay.tcc-user-account-evidence.enabled: false
cloudmall.pay.tcc-order-evidence.enabled: false
cloudmall.pay.tcc-stock-evidence.enabled: false
cloudmall.pay.tcc-delivery-evidence.enabled: false
cloudmall.pay.tcc-bridge.enabled: false
cloudmall.pay.tcc-receipt.enabled: false
cloudmall.pay.tcc-coordinator.enabled: false
cloudmall.pay.tcc-coordinator.timeout-ms: 30000
cloudmall.pay.tcc-recovery.enabled: false
cloudmall.pay.tcc-recovery.interval-ms: 5000
cloudmall.pay.tcc-recovery.batch-size: 20
cloudmall.pay.tcc-recovery.lease-seconds: 60
cloudmall.pay.tcc-recovery.budget-ms: 10000
cloudmall.pay.tcc-delivery.enabled: false
cloudmall.pay.tcc-delivery.interval-ms: 5000
cloudmall.pay.tcc-entry.enabled: false
management.endpoints.web.exposure.include: health,info,prometheus
feign.client.config.default: {connectTimeout: 3000, readTimeout: 5000}
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
seata:
  enabled: true
  enable-auto-data-source-proxy: false
  client.mode: AT
  registry.type: file
  config.type: file
  tx-service-group: cloudmall_tx_group
  service.vgroup-mapping.cloudmall_tx_group: default
  service.grouplist.default: ${CLOUDMALL_SEATA_TC:127.0.0.1:18091}

cloudmall.pay.tcc-cancel.enabled: false
cloudmall.pay.tcc-user-frozen-ownership-evidence.enabled: false
cloudmall.pay.tcc-user-terminal-frozen-ownership-evidence.enabled: false
cloudmall.pay.tcc-cancel.interval-ms: 5000

# CM18 16T28 只读关联退款集合消费，独立默认关闭。
cloudmall.pay.tcc-user-linked-refund-evidence.enabled: false

# CM18 16T29 同支付号原账本只读消费，独立默认关闭。
cloudmall.pay.tcc-user-payment-ledger-evidence.enabled: false
