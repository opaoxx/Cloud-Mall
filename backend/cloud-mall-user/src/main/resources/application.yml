server: {port: 8081}
spring:
  application: {name: cloud-mall-user}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_user?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root, driver-class-name: com.mysql.cj.jdbc.Driver}
  redis: {host: 127.0.0.1, port: 16379, password: root, timeout: 2s}
  jackson.time-zone: Asia/Shanghai
# 每个新物理连接只关闭自身元数据缓存，避免迁移前的AUTO_INCREMENT空值误拒启动。
spring.datasource.hikari.connection-init-sql: SET SESSION information_schema_stats_expiry=0
management.endpoints.web.exposure.include: health,info,prometheus
cloudmall.user.tcc-debit.enabled: false
cloudmall.user.tcc-resource.enabled: false
cloudmall.user.tcc-http.enabled: false
cloudmall.user.tcc-reconciliation.enabled: false
cloudmall.user.tcc-refund-evidence.enabled: false
cloudmall.user.tcc-frozen-ownership-evidence.enabled: false
cloudmall.user.tcc-terminal-frozen-ownership-evidence.enabled: false
cloudmall.user.tcc-payment-ledger-evidence.enabled: false
cloudmall.internal.callback-token: ${CLOUDMALL_INTERNAL_CALLBACK_TOKEN:cloudmall-local-callback}
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
seata:
  enabled: false
  enable-auto-data-source-proxy: false
  registry.type: file
  config.type: file
  tx-service-group: cloudmall_tx_group
  service.vgroup-mapping.cloudmall_tx_group: default
  service.grouplist.default: ${CLOUDMALL_SEATA_TC:127.0.0.1:18091}
