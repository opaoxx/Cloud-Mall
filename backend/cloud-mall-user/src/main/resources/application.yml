server: {port: 8081}
spring:
  application: {name: cloud-mall-user}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_user?serverTimezone=Asia/Shanghai", username: root, password: root, driver-class-name: com.mysql.cj.jdbc.Driver}
  redis: {host: 127.0.0.1, port: 16379, password: root, timeout: 2s}
  jackson.time-zone: Asia/Shanghai
management.endpoints.web.exposure.include: health,info,prometheus
spring.cloud.nacos.discovery.server-addr: localhost:8848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
