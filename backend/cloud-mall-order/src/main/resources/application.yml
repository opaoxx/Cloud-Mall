server: {port: 8084}
spring:
  application: {name: cloud-mall-order}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_order?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root}
  jackson.time-zone: Asia/Shanghai
  rabbitmq:
    host: localhost
    port: 15673
    username: root
    password: root
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  cloud.alibaba.seata.tx-service-group: cloudmall_tx_group
  task.scheduling.pool.size: 2
management.endpoints.web.exposure.include: health,info,prometheus
feign.client.config.default: {connectTimeout: 3000, readTimeout: 5000}
spring.cloud.sentinel.eager: true
spring.cloud.sentinel.transport.dashboard: localhost:8858
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
cloudmall.order.seckill.sentinel.flow-qps: 20
cloudmall.order.seckill.sentinel.user-qps: 20
cloudmall.order.seckill.sentinel.activity-qps: 20
cloudmall.order.sentinel.nacos-retry-ms: 5000
cloudmall:
  seata:
    cm18:
      enabled: false
  order:
    stock-degrade:
      reserve-slow-ms: 3000
      reserve-slow-ratio: 0.5
      exception-ratio: 0.2
      min-request-amount: 20
      stat-interval-ms: 60000
      time-window-seconds: 10
      nacos-retry-ms: 5000
      rule-group: CLOUDMALL_DEV
    outbox:
      dispatch-interval-ms: 1000
      batch-size: 50
      confirm-timeout-ms: 5000
      retry-delay-seconds: 10
seata:
  enabled: true
  client:
    mode: AT
    tm-commit-retry-count: 3
    tm-rollback-retry-count: 3
  registry:
    type: file
  config:
    type: file
  tx-service-group: cloudmall_tx_group
  service:
    vgroup-mapping:
      cloudmall_tx_group: default
    grouplist:
      default: ${CLOUDMALL_SEATA_TC:127.0.0.1:18091}
---
# 17A 启动审计继续拒绝该 profile；隔离节点规则由 OrderShardingRuleFactory 显式生成。
spring:
  config:
    activate:
      on-profile: sharding
