server: {port: 8082}
spring:
  application: {name: cloud-mall-product}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_product?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root}
  redis: {host: 127.0.0.1, port: 16379, password: root, timeout: 2s}
  rabbitmq:
    {host: localhost, port: 15673, username: root, password: root, publisher-confirm-type: correlated, publisher-returns: true, template: {mandatory: true}}
  jackson.time-zone: Asia/Shanghai
management.endpoints.web.exposure.include: health,info,prometheus
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
cloudmall:
  product:
    search:
      enabled: false
    elasticsearch:
      url: http://localhost:9200
      index: cloudmall_product
    index:
      dispatch-enabled: true
      consumer-enabled: true
      dlq-replay-enabled: true
      rebuild-enabled: false
      outbox-dispatch-ms: 1000
