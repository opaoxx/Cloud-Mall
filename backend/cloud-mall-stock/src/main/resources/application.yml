server: {port: 8085}
spring:
  application: {name: cloud-mall-stock}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_stock?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root, driver-class-name: com.mysql.cj.jdbc.Driver}
  redis: {host: 127.0.0.1, port: 16379, password: root, timeout: 2s}
  rabbitmq: {host: localhost, port: 15673, username: root, password: root, publisher-confirm-type: correlated, publisher-returns: true}
  task.scheduling.pool.size: 2
management.endpoints.web.exposure.include: health,info,prometheus
spring.cloud.sentinel.eager: true
spring.cloud.sentinel.transport.dashboard: localhost:8858
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
