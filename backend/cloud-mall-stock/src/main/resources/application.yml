server: {port: 8085}
spring:
  application: {name: cloud-mall-stock}
  datasource: {url: "jdbc:mysql://localhost:13307/cloudmall_stock?serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci", username: root, password: root, driver-class-name: com.mysql.cj.jdbc.Driver}
  redis: {host: 127.0.0.1, port: 16379, password: root, timeout: 2s}
  rabbitmq: {host: localhost, port: 15673, username: root, password: root, publisher-confirm-type: correlated, publisher-returns: true}
  task.scheduling.pool.size: 2
management.endpoints.web.exposure.include: health,info,prometheus
spring.cloud.sentinel.eager: true
spring.cloud.sentinel.transport.dashboard: localhost:8858
spring.cloud.nacos.discovery.server-addr: localhost:18848
spring.cloud.nacos.discovery.username: root
spring.cloud.nacos.discovery.password: root
cloudmall:
  stock:
    dependency-degrade:
      redis-seckill-write-slow-ms: 500
      redis-projection-slow-ms: 500
      mysql-reservation-slow-ms: 1000
      mysql-read-slow-ms: 500
      mysql-recovery-slow-ms: 2000
      slow-ratio-threshold: 0.5
      exception-ratio: 0.5
      min-request-amount: 20
      stat-interval-ms: 60000
      time-window-seconds: 10
      nacos-retry-ms: 5000
      rule-group: CLOUDMALL_DEV
    seckill:
      sentinel:
        flow-qps: 200
        nacos-retry-ms: 5000
        rule-group: CLOUDMALL_DEV
  seata:
    cm18:
      enabled: ${CLOUDMALL_SEATA_CM18_ENABLED:false}
      pause-after-stock-write-ms: ${CLOUDMALL_SEATA_CM18_PAUSE_AFTER_STOCK_WRITE_MS:0}
seata:
  enabled: ${CLOUDMALL_SEATA_ENABLED:false}
  client:
    mode: AT
    tm-commit-retry-count: 3
    tm-rollback-retry-count: 3
  registry:
    type: file
  config:
    type: file
  tx-service-group: cloudmall_tx_group
  service:
    vgroup-mapping:
      cloudmall_tx_group: default
    grouplist:
      default: ${CLOUDMALL_SEATA_TC:127.0.0.1:18091}
