name: cloud-mall-cm21-lab

x-lab-labels: &lab-labels
  cloudmall.cm21.owner: "${CM21_RUN_ID:?Set a unique CM21_RUN_ID for this experiment}"
  cloudmall.cm21.purpose: isolated-compose-experiment

services:
  mysql:
    profiles: [cm21]
    # The default is the local MySQL 8.0.46 image verified by the existing regressions.
    image: "${CM21_MYSQL_IMAGE:-sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}"
    pull_policy: never
    restart: "no"
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    labels: *lab-labels
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=1
      - --log-bin=cm21-bin
      - --binlog-format=ROW
      - --sync-binlog=1
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-doublewrite=ON
      - --transaction-isolation=REPEATABLE-READ
    ports:
      - "127.0.0.1:${CM21_MYSQL_PORT:-9919}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [lab]
    healthcheck:
      test: [CMD, mysql, --protocol=TCP, -h127.0.0.1, -uroot, -proot, -e, SELECT 1]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s

  rabbit:
    profiles: [cm21]
    image: rabbitmq:3.11-management
    pull_policy: never
    restart: "no"
    hostname: cm21-lab-rabbit
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    labels: *lab-labels
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    ports:
      - "127.0.0.1:${CM21_RABBIT_PORT:-9920}:5672"
      - "127.0.0.1:${CM21_RABBIT_MANAGEMENT_PORT:-9921}:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks: [lab]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 3s
      retries: 18

  es:
    profiles: [cm21]
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    pull_policy: never
    restart: "no"
    cpus: 2
    mem_limit: 1536m
    memswap_limit: 1536m
    labels: *lab-labels
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: "cm21-${CM21_RUN_ID}"
    ports:
      - "127.0.0.1:${CM21_ES_PORT:-9922}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s

  redis:
    profiles: [cm21]
    image: redis:7.0
    pull_policy: never
    restart: "no"
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    labels: *lab-labels
    environment:
      TZ: Asia/Shanghai
    command: [redis-server, --requirepass, root, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${CM21_REDIS_PORT:-9923}:6379"
    volumes:
      - redis_data:/data
    networks: [lab]
    healthcheck:
      test: [CMD, redis-cli, -a, root, ping]
      interval: 5s
      timeout: 3s
      retries: 18

volumes:
  mysql_data:
    labels: *lab-labels
  rabbit_data:
    labels: *lab-labels
  es_data:
    labels: *lab-labels
  redis_data:
    labels: *lab-labels

networks:
  lab:
    driver: bridge
    labels: *lab-labels
